[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vuyngoz-moearch_jd055"
version = "0.1.0"
description = "按结构键把条目聚类，标出MoE 模型架构师·批处理调度与吞吐折中上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vuyngoz" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://vuyngoz.github.io"
Repository = "https://github.com/vuyngoz/moearch_jd055"
Issues = "https://github.com/vuyngoz/moearch_jd055/issues"

[project.scripts]
moearch_jd055 = "moearch_jd055:main"

[tool.setuptools]
py-modules = ["moearch_jd055"]
